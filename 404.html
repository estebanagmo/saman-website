<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Samán</title>
  <script>
    /* GitHub Pages sirve /encuesta2026 desde encuesta2026.html, pero no
       /encuesta2026/ con barra final. Esa variante cae aquí y la mandamos a la
       buena conservando ?src=, que es el que identifica el canal del anuncio. */
    if (/^\/encuesta2026\/+(index\.html)?$/.test(location.pathname)) {
      location.replace('/encuesta2026' + location.search + location.hash);
    }
  </script>
  <!-- Rutas absolutas: este archivo se sirve en cualquier URL que no exista. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css?v=8" />
</head>
<body>

  <nav class="nav">
    <div class="nav__inner container">
      <a href="/" class="nav__logo"><img src="/assets/images/logo-saman.png" alt="Samán" class="nav__logo-img" width="2253" height="464" /></a>
    </div>
  </nav>

  <main class="lp-hero">
    <div class="container">
      <h1>Esta página no existe.</h1>
      <p class="lp-hero__sub">Puede que el enlace esté mal escrito o que la página se haya movido.</p>
      <div class="lp-hero__ctas">
        <a class="btn btn--primary" href="/">Ir al inicio</a>
        <a class="text-link" href="/encuesta2026">Estudio 2026 de crédito y cartera →</a>
      </div>
    </div>
  </main>

</body>
</html>
